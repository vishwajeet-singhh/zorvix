# Local Ollama runtime for Orvix.
#
# Orvix can start this automatically (it will run an `ollama/ollama` container on demand),
# but you can also bring it up yourself:
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5-coder:7b   # optional; Orvix auto-pulls
#
# All inference runs locally in this container. No source code leaves your machine.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: orvix-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Uncomment to enable NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
